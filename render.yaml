services:
  - type: web
    name: uniconnect-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install && pnpm exec prisma generate && pnpm --filter @uniconnect/api build
    startCommand: pnpm exec prisma db push --accept-data-loss && pnpm --filter @uniconnect/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uniconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://uniconnect-web.onrender.com

  - type: web
    name: uniconnect-web
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install && pnpm --filter @uniconnect/web build
    startCommand: pnpm --filter @uniconnect/web start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://uniconnect-api.onrender.com

databases:
  - name: uniconnect-db
    plan: basic-256mb
    region: singapore
